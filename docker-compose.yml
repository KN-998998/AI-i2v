name: short-video

services:
  short-video-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: short-video-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8015
      APP_RELOAD: "false"
    # Set APP_UID/APP_GID to the Linux deploy user's numeric IDs before start.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    ports:
      - "127.0.0.1:8015:8015"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/api/config', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
