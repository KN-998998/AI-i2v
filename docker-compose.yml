name: short-video

services:
  short-video-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: short-video-app
    restart: unless-stopped
    # A newly provisioned environment can start safely without provider keys.
    # Add a local .env later to enable Kling, TTS, and image-processing APIs.
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8015
      APP_RELOAD: "false"
      # OSS uses the ECS RAM role for temporary credentials; these are only
      # non-sensitive bucket/layout settings and intentionally contain no AK/SK.
      OSS_BUCKET: patrick0619
      OSS_ENDPOINT: https://oss-cn-shenzhen.aliyuncs.com
      OSS_REGION: cn-shenzhen
      OSS_ASSET_PREFIX: 图片素材库
    # Set APP_UID/APP_GID to the Linux deploy user's numeric IDs before start.
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    ports:
      - "127.0.0.1:8015:8015"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/api/config', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
