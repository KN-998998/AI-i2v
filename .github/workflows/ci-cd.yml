name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: short-video-production
  cancel-in-progress: false
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend test
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend compile
        run: python -m compileall -q web pipeline
      - name: Backend test
        run: mkdir -p .tmp && python -m pytest
  deploy:
    name: Deploy to Windows ECS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/short-video-deploy"
          chmod 600 "$HOME/.ssh/short-video-deploy"
          ssh-keygen -y -f "$HOME/.ssh/short-video-deploy" >/dev/null
      - name: Deploy to Windows ECS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          REMOTE_COMMAND="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"$DEPLOY_PATH\\scripts\\deploy_windows.ps1\" -ProjectRoot \"$DEPLOY_PATH\""
          ssh -i "$HOME/.ssh/short-video-deploy" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_COMMAND"
          REMOTE_STATUS="powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"\$listener=Get-NetTCPConnection -LocalPort 8015 -State Listen -ErrorAction SilentlyContinue; if (\$null -eq \$listener) { throw 'TCP 8015 is not listening after SSH deploy' }; \$listener | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize\""
          ssh -i "$HOME/.ssh/short-video-deploy" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_STATUS"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "http://${DEPLOY_HOST}:8015/api/config" >/dev/null; then
              echo "Public API health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Public API health check failed: http://${DEPLOY_HOST}:8015/api/config" >&2
          exit 1
