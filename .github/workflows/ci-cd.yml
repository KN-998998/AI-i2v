name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: short-video-production
  cancel-in-progress: false
jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: frontend
        run: npm.cmd ci
      - name: Frontend test
        working-directory: frontend
        run: npm.cmd test
      - name: Frontend build
        working-directory: frontend
        run: npm.cmd run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend compile
        run: python -m compileall -q web pipeline
      - name: Backend test
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          python -m pytest
  deploy:
    name: Deploy to Windows ECS
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_KEY)) { throw "DEPLOY_SSH_KEY is required." }
          $keyPath = Join-Path $env:RUNNER_TEMP "short-video-deploy"
          $keyText = $env:DEPLOY_SSH_KEY -replace "`r", ""
          [System.IO.File]::WriteAllText($keyPath, $keyText, [System.Text.Encoding]::ASCII)
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          ssh-keygen.exe -y -f $keyPath | Out-Null
          "DEPLOY_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Deploy to Windows ECS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_HOST)) { throw "DEPLOY_HOST is required." }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_USER)) { throw "DEPLOY_USER is required." }
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_PATH)) { throw "DEPLOY_PATH is required." }
          $port = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_PORT)) { "22" } else { $env:DEPLOY_PORT }
          $target = "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)"
          $remoteCommand = 'powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}\scripts\deploy_windows.ps1" -ProjectRoot "{0}"' -f $env:DEPLOY_PATH
          $sshOptions = @(
            "-i", $env:DEPLOY_KEY_PATH,
            "-p", $port,
            "-o", "IdentitiesOnly=yes",
            "-o", "BatchMode=yes",
            "-o", "PreferredAuthentications=publickey",
            "-o", "PasswordAuthentication=no",
            "-o", "KbdInteractiveAuthentication=no",
            "-o", "ConnectTimeout=15",
            "-o", "ServerAliveInterval=30",
            "-o", "ServerAliveCountMax=20",
            "-o", "StrictHostKeyChecking=accept-new",
            $target,
            $remoteCommand
          )
          & ssh.exe @sshOptions
          if ($LASTEXITCODE -ne 0) { throw "Windows ECS deployment failed with exit code $LASTEXITCODE." }
          $healthy = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "http://$($env:DEPLOY_HOST):8015/api/config" -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $healthy) { throw "Public API health check failed: http://$($env:DEPLOY_HOST):8015/api/config" }
          Write-Host "Public API health check passed."
