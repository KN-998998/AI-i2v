# 批量生产配置模板
# ==================
# 每天生产前复制此模板，填入当天的菜品清单和视频编排。
# 使用方式：python pipeline/run_batch.py --config batch_20260814.yaml

batch:
  date: "2026-08-14"           # 批量日期
  name: "日常引流批次"          # 批次名称
  output_dir: ""               # 留空则自动用 output/batch_YYYYMMDD

# ── 菜品清单 ──────────────────────────────────────────────────────
# name:      菜名（用于匹配素材文件夹和生成提示词）
# category:  菜品类型（热菜/面食/淋酱/饮品/烤物炸物/飘雪干冰）
# highlight: 亮点描述（供 AI 写提示词参考）
# image_dir: 可选，手动指定图片文件夹路径；留空则自动按菜名匹配
dishes:
  - name: "海胆天妇罗"
    category: "烤物/炸物"
    highlight: "酥脆外皮，切开后海胆流出"
  - name: "松叶蟹三吃"
    category: "热菜"
    highlight: "拆蟹过程，蟹腿肉质饱满"
  - name: "蒲烧鳗鱼"
    category: "热菜"
    highlight: "酱汁油亮，入口即化"
  - name: "海螺刺身"
    category: "刺身"
    highlight: "新鲜切片，晶莹剔透"
  - name: "红酒鹅肝"
    category: "热菜"
    highlight: "红酒酱汁淋下，质感细腻"
  - name: "角切鱼生饭"
    category: "面食/饭类"
    highlight: "多种鱼生铺满，色彩丰富"

# ── 视频编排（10条） ──────────────────────────────────────────────
# type: multi_dish = 多菜组合 / variant = 同菜变体
# dishes: multi_dish 时列出菜名（引用上方 dishes）
# base + swap: variant 时指定基础视频和交换元素
videos:
  # --- 多菜组合（不同菜品搭配） ---
  - id: v01
    type: multi_dish
    template: 5_dish              # 5道菜模板 (12s)
    dishes: [海胆天妇罗, 松叶蟹三吃, 蒲烧鳗鱼, 海螺刺身, 红酒鹅肝]
    hook_dish: 海胆天妇罗          # 第一个镜头用哪道菜（视觉冲击最强）
    subtitle_style: "暖色高级感"

  - id: v02
    type: multi_dish
    template: 5_dish
    dishes: [松叶蟹三吃, 角切鱼生饭, 海螺刺身, 蒲烧鳗鱼, 海胆天妇罗]
    hook_dish: 松叶蟹三吃
    subtitle_style: "暖色高级感"

  - id: v03
    type: multi_dish
    template: 3_dish              # 3道菜模板 (10s)
    dishes: [海胆天妇罗, 红酒鹅肝, 角切鱼生饭]
    hook_dish: 海胆天妇罗
    subtitle_style: "烟火气"

  - id: v04
    type: multi_dish
    template: 3_dish
    dishes: [蒲烧鳗鱼, 海螺刺身, 松叶蟹三吃]
    hook_dish: 蒲烧鳗鱼
    subtitle_style: "烟火气"

  - id: v05
    type: multi_dish
    template: 5_dish
    dishes: [红酒鹅肝, 海胆天妇罗, 角切鱼生饭, 松叶蟹三吃, 海螺刺身]
    hook_dish: 红酒鹅肝
    subtitle_style: "促销感"

  # --- 同菜变体（换文案/BGM/顺序） ---
  - id: v06
    type: variant
    base: v01
    swap: [文案, 顺序]             # 换文案 + 换菜品顺序
    subtitle_style: "促销感"

  - id: v07
    type: variant
    base: v02
    swap: [文案]
    subtitle_style: "暖色高级感"

  - id: v08
    type: variant
    base: v03
    swap: [顺序]
    subtitle_style: "烟火气"

  - id: v09
    type: variant
    base: v04
    swap: [文案, 顺序]
    subtitle_style: "暖色高级感"

  - id: v10
    type: variant
    base: v05
    swap: [文案]
    subtitle_style: "促销感"

# ── 品牌信息（片尾 CTA 用） ──────────────────────────────────────
brand:
  name: "示例品牌"
  location: "XX路XX店"
  cta: "评论区领优惠券"
  logo: ""                        # logo 图片路径（留空则不叠加）

# ── BGM ──────────────────────────────────────────────────────────
bgm:
  file: ""                        # 留空则用 config.py 中的默认 BGM
  volume: 0.3                     # BGM 音量（0-1）
