<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引流视频生产平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EAF3FA;
  --surface: #FFFFFF;
  --surface-2: #F0F7FC;
  --border: #C9DDEB;
  --text: #1B2A38;
  --text-dim: #5A7285;
  --text-mute: #8AA3B5;
  --primary: #E8730C;
  --primary-dim: #B85A08;
  --primary-glow: rgba(232, 115, 12, 0.12);
  --green: #3E8E5A;
  --red: #E63946;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 8px 32px rgba(70, 120, 160, 0.14);
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Noto Sans SC", -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── 氛围背景 ── */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,115,12,0.08), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(90,160,220,0.10), transparent);
  pointer-events: none;
  z-index: 0;
}

/* ── 顶部导航 ── */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(234, 243, 250, 0.85);
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #FF9F1C);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #1A1816;
}

.brand-text {
  font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
}

.brand-sub {
  font-size: 12px; color: var(--text-mute);
  font-family: "DM Mono", monospace;
}

.config-badges {
  display: flex; gap: 8px;
}

.config-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.config-badge.ok { color: var(--green); border-color: rgba(127,176,105,0.3); }
.config-badge.no { color: var(--red); border-color: rgba(230,57,70,0.3); }

.config-badge::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}

/* ── 步骤指示器 ── */
.steps-bar {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 24px 32px 16px;
  border-bottom: 1px solid var(--border);
}

.step-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  transition: var(--transition);
  opacity: 0.4;
}

.step-item.active { opacity: 1; }
.step-item.done { opacity: 0.7; }
.step-item:hover { opacity: 0.8; }

.step-num {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  border: 2px solid var(--border);
  background: var(--surface);
  transition: var(--transition);
}

.step-item.active .step-num {
  border-color: var(--primary);
  background: var(--primary-glow);
  color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}

.step-item.done .step-num {
  border-color: var(--green);
  background: var(--green);
  color: var(--bg);
}

.step-label {
  font-size: 13px; font-weight: 500;
}

.step-line {
  width: 40px; height: 2px;
  background: var(--border);
  margin: 0 -8px;
}

.step-item.done + .step-line { background: var(--green); }

/* ── 主内容区 ── */
.main {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px;
  min-height: calc(100vh - 180px);
}

.step-panel {
  display: none;
  animation: fadeUp 0.4s ease;
}

.step-panel.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── 通用组件 ── */
.panel-title {
  font-size: 24px; font-weight: 700;
  margin-bottom: 8px;
}

.panel-desc {
  color: var(--text-dim); font-size: 14px;
  margin-bottom: 24px;
}

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
  font-family: inherit;
  border: none; cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
}

.btn-primary {
  background: var(--primary);
  color: #1A1816;
}

.btn-primary:hover {
  background: #FF9F1C;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px var(--primary-glow);
}

.btn-primary:disabled {
  background: var(--surface-2);
  color: var(--text-mute);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-ghost {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 12px;
}

/* ── 输入框 ── */
.input, .textarea, .select {
  width: 100%;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: var(--transition);
}

.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.textarea { resize: vertical; min-height: 80px; }

.field-label {
  display: block;
  font-size: 13px; font-weight: 500;
  margin-bottom: 6px;
  color: var(--text-dim);
}

.field-group { margin-bottom: 16px; }

/* ── 菜品卡片 ── */
.dish-list {
  display: flex; flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.dish-card {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}

.dish-card:hover {
  border-color: var(--primary-dim);
}

.dish-drag {
  display: flex; align-items: center; justify-content: center;
  width: 40px;
  background: var(--surface-2);
  cursor: grab;
  color: var(--text-mute);
  font-size: 18px;
}

.dish-drag:active { cursor: grabbing; }

.dish-rank {
  display: flex; align-items: center; justify-content: center;
  width: 40px;
  font-family: "DM Mono", monospace;
  font-size: 18px; font-weight: 500;
  color: var(--primary);
}

.dish-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1.5fr 1fr 2fr auto;
  gap: 12px;
  padding: 12px 16px;
  align-items: center;
}

.dish-img-preview {
  width: 56px; height: 56px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  background: var(--surface-2);
}

.dish-img-placeholder {
  width: 56px; height: 56px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-mute); font-size: 20px;
  border: 1px dashed var(--border);
}

.dish-remove {
  background: none; border: none;
  color: var(--text-mute);
  cursor: pointer; font-size: 18px;
  padding: 8px;
  transition: var(--transition);
}

.dish-remove:hover { color: var(--red); }

/* ── 上传区 ── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-dim);
  font-size: 14px;
}

.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary);
  background: var(--primary-glow);
  color: var(--primary);
}

.upload-zone input { display: none; }

/* ── 进度区 ── */
.progress-container {
  text-align: center;
  padding: 48px 32px;
}

.progress-ring {
  width: 80px; height: 80px;
  margin: 0 auto 24px;
  position: relative;
}

.progress-ring svg {
  transform: rotate(-90deg);
}

.progress-ring circle {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
}

.progress-ring .track { stroke: var(--border); }
.progress-ring .bar { stroke: var(--primary); transition: stroke-dashoffset 0.5s; }

.progress-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: "DM Mono", monospace;
  font-size: 16px; font-weight: 700;
  color: var(--primary);
}

.progress-label {
  font-size: 16px; font-weight: 500;
  margin-bottom: 8px;
}

.progress-detail {
  font-size: 13px;
  color: var(--text-dim);
  font-family: "DM Mono", monospace;
}

.progress-log {
  margin-top: 24px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  max-height: 200px;
  overflow-y: auto;
  font-family: "DM Mono", monospace;
  font-size: 12px;
  color: var(--text-dim);
}

.log-line { padding: 2px 0; }
.log-line.ok { color: var(--green); }
.log-line.err { color: var(--red); }

/* ── 审核区 ── */
.review-group {
  margin-bottom: 32px;
}

.review-dish-name {
  font-size: 18px; font-weight: 700;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

.review-dish-name::before {
  content: ""; width: 4px; height: 20px;
  background: var(--primary); border-radius: 2px;
}

.clips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.clip-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}

.clip-card:hover { border-color: var(--primary-dim); }

.clip-card.selected {
  border-color: var(--green);
  box-shadow: 0 0 16px rgba(127, 176, 105, 0.2);
}

.clip-card.selected::after {
  content: "✓ 已选用";
  position: absolute;
  top: 8px; right: 8px;
  background: var(--green);
  color: var(--bg);
  font-size: 11px; font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

.clip-card video {
  width: 100%; display: block;
  aspect-ratio: 9/16;
  background: #000;
}

.clip-info {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-dim);
  display: flex; justify-content: space-between;
}

/* ── 提示词卡片 ── */
.prompt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.prompt-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}

.prompt-card:hover { border-color: var(--primary-dim); }

.prompt-card.selected {
  border-color: var(--green);
  box-shadow: 0 0 16px rgba(127, 176, 105, 0.2);
}

.prompt-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.variant-badge {
  background: var(--primary-glow);
  color: var(--primary);
  font-size: 12px; font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
}

.prompt-card.selected .variant-badge {
  background: var(--green);
  color: var(--bg);
}

.prompt-check {
  font-size: 12px; font-weight: 600;
  color: var(--text-mute);
}

.prompt-card.selected .prompt-check { color: var(--green); }
.prompt-card .textarea { cursor: text; }

/* ── 文案编辑 ── */
.caption-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.caption-dish {
  font-size: 15px; font-weight: 600;
  margin-bottom: 12px;
  color: var(--primary);
}

.caption-field { margin-bottom: 12px; }
.caption-field:last-child { margin-bottom: 0; }

/* ── 成片展示 ── */
.final-container {
  text-align: center;
  padding: 32px;
}

.final-video {
  max-width: 320px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin: 0 auto 24px;
  display: block;
}

.final-caption {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin: 16px auto;
  max-width: 480px;
  text-align: left;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.6;
}

.final-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
  margin: 24px 0;
  text-align: left;
}

.final-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}

.final-card video {
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: var(--radius-sm);
  background: #000;
}

.final-card-title {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 10px 0 6px;
  font-size: 14px;
  font-weight: 700;
}

.final-card-meta {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.5;
}

/* ── 底部操作栏 ── */
.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

/* ── 批次历史 ── */
.batch-list {
  display: flex; flex-direction: column;
  gap: 8px;
}

.batch-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}

.batch-item:hover {
  border-color: var(--primary-dim);
  background: var(--surface-2);
}

.batch-info { display: flex; flex-direction: column; gap: 2px; }
.batch-name { font-size: 14px; font-weight: 500; }
.batch-date { font-size: 12px; color: var(--text-mute); font-family: "DM Mono", monospace; }

.batch-status {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 500;
}

.batch-status.done { background: rgba(127,176,105,0.15); color: var(--green); }
.batch-status.reviewing { background: rgba(232,115,12,0.15); color: var(--primary); }
.batch-status.composing { background: rgba(232,115,12,0.15); color: var(--primary); }
.batch-status.error { background: rgba(230,57,70,0.15); color: var(--red); }
.batch-status.created, .batch-status.configured { background: var(--surface-2); color: var(--text-dim); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 24px;
  font-size: 14px;
  box-shadow: var(--shadow);
  z-index: 1000;
  opacity: 0;
  transition: var(--transition);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.ok { border-color: var(--green); }
.toast.err { border-color: var(--red); }

/* ── 空状态 ── */
.empty {
  text-align: center;
  padding: 64px 32px;
  color: var(--text-mute);
}

.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-text { font-size: 15px; }

/* ── 滚动条 ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">鮨</div>
    <div>
      <div class="brand-text">引流视频生产平台</div>
      <div class="brand-sub">AI Video Pipeline</div>
    </div>
  </div>
  <div class="config-badges" id="configBadges"></div>
</div>

<!-- 步骤指示器 -->
<div class="steps-bar" id="stepsBar"></div>

<!-- 主内容 -->
<div class="main" id="main"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 全局状态 ──────────────────────────────────────────────────────
let currentBatch = null;
let currentStep = 0;

const STEPS = [
  { num: 1, label: "创建批次" },
  { num: 2, label: "菜品配置" },
  { num: 3, label: "提示词编辑" },
  { num: 4, label: "生成视频" },
  { num: 5, label: "审核挑选" },
  { num: 6, label: "合成下载" },
];

// ── 工具函数 ──────────────────────────────────────────────────────

async function api(url, options = {}) {
  const resp = await fetch(url, {
    ...options,
    headers: { "Content-Type": "application/json", ...options.headers },
  });
  if (!resp.ok) throw new Error(`API ${resp.status}`);
  return resp.json();
}

function toast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + type;
  setTimeout(() => el.className = "toast", 3000);
}

function renderSteps() {
  const bar = document.getElementById("stepsBar");
  bar.innerHTML = STEPS.map((s, i) => {
    const cls = s.num === currentStep ? "active" : (s.num < currentStep ? "done" : "");
    const check = s.num < currentStep ? "✓" : s.num;
    return `
      <div class="step-item ${cls}" onclick="goStep(${s.num})">
        <div class="step-num">${check}</div>
        <div class="step-label">${s.label}</div>
      </div>
      ${i < STEPS.length - 1 ? '<div class="step-line"></div>' : ""}
    `;
  }).join("");
}

function goStep(n) {
  if (!currentBatch && n > 1) return;
  if (currentBatch && n <= currentStep + 1) {
    currentStep = n;
    renderSteps();
    renderPanel();
  }
}

function showPanel(html) {
  document.getElementById("main").innerHTML = html;
}

// ── 配置检查 ──────────────────────────────────────────────────────

async function checkConfig() {
  const cfg = await api("/api/config");
  const badges = document.getElementById("configBadges");
  badges.innerHTML = `
    <div class="config-badge ${cfg.deepseek ? 'ok' : 'no'}">DeepSeek</div>
    <div class="config-badge ${cfg.kling ? 'ok' : 'no'}">Kling</div>
    <div class="config-badge ${cfg.image_library_exists ? 'ok' : 'no'}">素材库</div>
  `;
}

// ── Step 1: 创建批次 ─────────────────────────────────────────────

function renderStep1() {
  showPanel(`
    <div class="panel-title">创建新批次</div>
    <div class="panel-desc">输入批次信息，开始今天的视频生产</div>

    <div class="field-group">
      <label class="field-label">批次名称</label>
      <input class="input" id="batchName" placeholder="如：8月14日午市引流" />
    </div>

    <div class="field-group">
      <label class="field-label">日期</label>
      <input class="input" id="batchDate" type="date" value="${new Date().toISOString().split('T')[0]}" />
    </div>

    <div style="margin: 32px 0 24px; padding-top: 24px; border-top: 1px solid var(--border);">
      <div class="panel-title" style="font-size: 18px;">历史批次</div>
    </div>
    <div id="batchList" class="batch-list"></div>

    <div class="action-bar">
      <div></div>
      <button class="btn btn-primary" onclick="createBatch()">下一步 →</button>
    </div>
  `);
  loadBatches();
}

async function loadBatches() {
  try {
    const batches = await api("/api/batches");
    const el = document.getElementById("batchList");
    if (!batches.length) {
      el.innerHTML = '<div class="empty"><div class="empty-text">暂无历史批次</div></div>';
      return;
    }
    el.innerHTML = batches.map(b => `
      <div class="batch-item" onclick="openBatch('${b.id}')">
        <div class="batch-info">
          <div class="batch-name">${b.name || b.id}</div>
          <div class="batch-date">${b.date} · ${b.dish_count} 道菜</div>
        </div>
        <div class="batch-status ${b.status}">${statusText(b.status)}</div>
      </div>
    `).join("");
  } catch(e) {
    document.getElementById("batchList").innerHTML = '<div class="empty"><div class="empty-text">加载失败</div></div>';
  }
}

function statusText(s) {
  const map = {
    created: "已创建", configured: "已配置", generating: "生成中",
    reviewing: "待审核", selected: "已挑选", composing: "合成中",
    done: "已完成", error: "出错"
  };
  return map[s] || s;
}

async function createBatch() {
  const name = document.getElementById("batchName").value.trim();
  const date = document.getElementById("batchDate").value.replace(/-/g, "");

  if (!name) { toast("请填写批次名称", "err"); return; }

  try {
    const result = await api("/api/batch", {
      method: "POST",
      body: JSON.stringify({ name, date }),
    });
    currentBatch = result.id;
    currentStep = 2;
    selectedClips = {};
    promptsData = [];
    captionsData = {};
    step6Mode = "edit";
    renderSteps();
    renderStep2();
  } catch(e) {
    toast("创建失败: " + e.message, "err");
  }
}

async function openBatch(batchId) {
  try {
    const state = await api(`/api/batch/${batchId}`);
    currentBatch = batchId;
    selectedClips = state.selected_clips || {};
    // 根据状态跳到对应步骤
    const statusMap = {
      created: 2, configured: 2, generating: 4,
      reviewing: 5, selected: 6, composing: 6, done: 6, error: 4
    };
    currentStep = statusMap[state.status] || 2;
    step6Mode = (state.status === "composing" || state.status === "done") ? "compose" : "edit";
    renderSteps();
    renderPanel();
  } catch(e) {
    toast("打开失败", "err");
  }
}

// ── Step 2: 菜品配置 ─────────────────────────────────────────────

let dishes = [];

function renderStep2() {
  showPanel(`
    <div class="panel-title">菜品配置</div>
    <div class="panel-desc">添加菜品、上传图片、拖拽调整展示顺序（第一个 = 开场钩子镜头）</div>

    <div class="dish-list" id="dishList"></div>

    <button class="btn btn-ghost" onclick="addDish()">+ 添加菜品</button>

    <div class="action-bar">
      <button class="btn btn-ghost" onclick="goStep(1); renderStep1();">← 上一步</button>
      <button class="btn btn-primary" onclick="submitDishes()">下一步：AI生成提示词 →</button>
    </div>
  `);

  // 如果已有菜品数据，加载；否则保留当前全局 dishes（含用户已填未提交的内容）
  if (currentBatch) {
    api(`/api/batch/${currentBatch}`).then(state => {
      if (state.dishes && state.dishes.length) {
        // 后端有已保存的菜 → 以它为准
        dishes = state.dishes;
        renderDishes();
      } else if (!dishes.length) {
        // 后端空且全局也没有 → 给一个默认空行
        addDish();
      } else {
        // 后端空但全局已有（用户填了没提交 / 多次往返）→ 保留，不加菜
        renderDishes();
      }
    });
  } else {
    if (!dishes.length) addDish();
    else renderDishes();
  }
}

function renderDishes() {
  const el = document.getElementById("dishList");
  el.innerHTML = dishes.map((d, i) => `
    <div class="dish-card" draggable="true" data-index="${i}"
         ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)">
      <div class="dish-drag">⋮⋮</div>
      <div class="dish-rank">${i + 1}</div>
      <div class="dish-body">
        <input class="input" placeholder="菜名" value="${d.name || ''}"
               onchange="updateDish(${i}, 'name', this.value)" />
        <input class="input" placeholder="类型（如：烤物/刺身）" value="${d.category || ''}"
               onchange="updateDish(${i}, 'category', this.value)" />
        <input class="input" placeholder="亮点（如：酥脆爆浆）" value="${d.highlight || ''}"
               onchange="updateDish(${i}, 'highlight', this.value)" />
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="dish-img-placeholder" id="imgPreview${i}" onclick="document.getElementById('fileInput${i}').click()">📷</div>
          <input type="file" id="fileInput${i}" accept="image/*" style="display:none"
                 onchange="uploadDishImage(${i}, this.files)" />
          <button class="dish-remove" onclick="removeDish(${i})">✕</button>
        </div>
      </div>
    </div>
  `).join("");
}

function addDish() {
  dishes.push({ name: "", category: "", highlight: "", images: [] });
  renderDishes();
}

function removeDish(i) {
  dishes.splice(i, 1);
  renderDishes();
}

function updateDish(i, field, value) {
  dishes[i][field] = value;
}

async function uploadDishImage(i, files) {
  if (!files.length) return;
  const formData = new FormData();
  formData.append("dish", dishes[i].name || `dish_${i}`);
  for (const f of files) formData.append("files", f);

  try {
    const resp = await fetch(`/api/batch/${currentBatch}/upload`, {
      method: "POST", body: formData,
    });
    const result = await resp.json();
    dishes[i].images = result.images;
    // 显示预览
    const preview = document.getElementById(`imgPreview${i}`);
    preview.innerHTML = `<img class="dish-img-preview" src="/api/library/preview?path=${encodeURIComponent(result.images[0])}" />`;
    preview.onclick = null;
    toast("图片已上传", "ok");
  } catch(e) {
    toast("上传失败", "err");
  }
}

// 拖拽排序
let dragIndex = null;

function dragStart(e) {
  dragIndex = parseInt(e.currentTarget.dataset.index);
}

function dragOver(e) {
  e.preventDefault();
}

function drop(e) {
  e.preventDefault();
  const dropIndex = parseInt(e.currentTarget.dataset.index);
  if (dragIndex !== null && dragIndex !== dropIndex) {
    const item = dishes.splice(dragIndex, 1)[0];
    dishes.splice(dropIndex, 0, item);
    renderDishes();
  }
  dragIndex = null;
}

async function submitDishes() {
  // 过滤空菜品
  dishes = dishes.filter(d => d.name.trim());

  if (!dishes.length) { toast("请至少添加一道菜", "err"); return; }

  try {
    await api(`/api/batch/${currentBatch}/dishes`, {
      method: "POST",
      body: JSON.stringify({ dishes }),
    });
    toast("菜品配置已保存", "ok");
    currentStep = 3;
    renderSteps();
    renderStep3();
  } catch(e) {
    toast("保存失败", "err");
  }
}

// ── Step 3: 提示词编辑 ─────────────────────────────────────────────

let promptsData = [];

async function renderStep3() {
  showPanel(`
    <div class="panel-title">提示词编辑</div>
    <div class="panel-desc">AI 已为每道菜生成图生视频提示词，请审阅修改后点击"生成视频"</div>
    <div id="promptsContainer">
      <div class="progress-container" style="padding:32px;">
        <div class="progress-ring">
          <svg width="64" height="64">
            <circle class="track" cx="32" cy="32" r="26" />
            <circle class="bar" cx="32" cy="32" r="26"
                    stroke-dasharray="163.4" stroke-dashoffset="163.4" id="promptsProgress" />
          </svg>
          <div class="progress-text" id="promptsText">0%</div>
        </div>
        <div class="progress-label" id="promptsLabel">正在加载提示词...</div>
        <div class="progress-detail" id="promptsDetail"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="btn btn-ghost" onclick="goStep(2); renderStep2();">← 上一步</button>
      <button class="btn btn-primary" id="generateBtn" onclick="generateVideos()" disabled>生成视频 →</button>
    </div>
  `);

  // 先查该批次是否已有提示词（避免重复调用 LLM）
  try {
    promptsData = await api(`/api/batch/${currentBatch}/prompts`);
    if (promptsData && promptsData.length) {
      if (hasCompletePromptVariants(promptsData)) {
        // 已有完整方案时直接复用，不再重复调用 LLM。
        updateProgress3(100, "提示词已生成", "直接复用已有结果");
        renderPromptsEditor();
      } else {
        renderPromptUpgradeRequired();
      }
      return;
    }
  } catch(e) {
    // 查询失败继续走生成流程
  }

  // 无提示词 → 自动执行 step1（图片预处理）→ step2（AI 生成提示词）
  try {
    await api(`/api/batch/${currentBatch}/run/step1`, { method: "POST" });
    await pollStep("step1");
    updateProgress3(50, "正在生成提示词...", "调用 DeepSeek");

    await api(`/api/batch/${currentBatch}/run/step2`, { method: "POST" });
    await pollStep("step2");
    updateProgress3(100, "提示词已生成", "");

    // 读取生成的提示词
    promptsData = await api(`/api/batch/${currentBatch}/prompts`);
    renderPromptsEditor();
  } catch(e) {
    document.getElementById("promptsContainer").innerHTML =
      `<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">生成失败: ${e.message}</div></div>`;
  }
}

function updateProgress3(percent, label, detail) {
  const bar = document.getElementById("promptsProgress");
  const text = document.getElementById("promptsText");
  const lbl = document.getElementById("promptsLabel");
  const det = document.getElementById("promptsDetail");
  if (bar) bar.style.strokeDashoffset = 163.4 * (1 - percent / 100);
  if (text) text.textContent = percent + "%";
  if (lbl) lbl.textContent = label;
  if (det) det.textContent = detail || "";
}

function hasCompletePromptVariants(prompts) {
  const countByDish = {};
  prompts.forEach(p => {
    countByDish[p.dish] = (countByDish[p.dish] || 0) + 1;
  });
  return Object.values(countByDish).every(count => count >= 3);
}

function renderPromptUpgradeRequired() {
  const container = document.getElementById("promptsContainer");
  container.innerHTML = `
    <div class="empty">
      <div class="empty-text">这个旧批次只有单条提示词，尚未生成推近、环绕、横移 3 个方案。</div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="regeneratePromptVariants()">生成 3 个方案</button>
    </div>
  `;
  document.getElementById("generateBtn").disabled = true;
}

async function regeneratePromptVariants() {
  const container = document.getElementById("promptsContainer");
  container.innerHTML = `
    <div class="progress-container" style="padding:32px;">
      <div class="progress-label">正在生成 3 个提示词方案...</div>
      <div class="progress-detail" id="promptsDetail"></div>
    </div>
  `;
  try {
    await api(`/api/batch/${currentBatch}/run/step2`, {
      method: "POST",
      body: JSON.stringify({ force: true }),
    });
    await pollStep("step2");
    promptsData = await api(`/api/batch/${currentBatch}/prompts`);
    renderPromptsEditor();
  } catch(e) {
    container.innerHTML = `<div class="empty"><div class="empty-text">生成失败: ${e.message}</div></div>`;
  }
}

function renderPromptsEditor() {
  const container = document.getElementById("promptsContainer");

  if (!promptsData.length) {
    container.innerHTML = '<div class="empty"><div class="empty-text">暂无提示词</div></div>';
    return;
  }

  // 按菜分组（后端每菜 3 个 variant）
  const byDish = {};
  promptsData.forEach((p, index) => {
    (byDish[p.dish] = byDish[p.dish] || []).push({ p, index });
  });

  // 默认勾选：没有任何勾选时，每菜勾第 1 条（variant v1）
  const anySelected = promptsData.some(p => p.selected);
  if (!anySelected) {
    promptsData.forEach(p => {
      p.selected = (byDish[p.dish][0].p === p);
    });
  }

  container.innerHTML = `
    <div style="margin-bottom:16px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; color:var(--text-dim);">
      💡 每道菜已生成 3 个不同运镜方向的提示词卡片（推近 / 环绕 / 横移），可点卡片勾选或取消。
      生成 1 段视频选 1 张、生成 2 段选 2 张、最多 3 张全选；<b>只有勾选的卡片才会调用可灵 API 生成视频</b>。提示词可直接在卡片内修改。
    </div>
    ${Object.keys(byDish).map(dish => `
      <div class="review-group">
        <div class="review-dish-name">${dish}</div>
        <div class="prompt-grid">
          ${byDish[dish].map(({ p, index }) => `
            <div class="prompt-card ${p.selected ? "selected" : ""}"
                 data-dish="${dish}" data-variant="${p.variant_id || "v1"}"
                 onclick="togglePromptCard(${index}, this)">
              <div class="prompt-card-head">
                <span class="variant-badge">${p.variant_label || p.variant_id || "方案"}</span>
                <span class="prompt-check">${p.selected ? "✓ 已选" : "未选"}</span>
              </div>
              <textarea class="textarea" style="min-height:110px;" onclick="event.stopPropagation()"
                        onchange="promptsData[${index}].video_prompt = this.value">${p.video_prompt}</textarea>
            </div>
          `).join("")}
        </div>
      </div>
    `).join("")}
  `;

  updateGenerateHint();
  document.getElementById("generateBtn").disabled = false;
}

function togglePromptCard(index, card) {
  const p = promptsData[index];
  if (!p) return;
  p.selected = !p.selected;
  card.classList.toggle("selected", p.selected);
  const check = card.querySelector(".prompt-check");
  if (check) check.textContent = p.selected ? "✓ 已选" : "未选";
  updateGenerateHint();
}

function updateGenerateHint() {
  const n = promptsData.filter(p => p.selected).length;
  const btn = document.getElementById("generateBtn");
  if (!btn) return;
  btn.textContent = n ? `生成视频（${n} 个片段）→` : "生成视频 →";
  btn.disabled = n === 0;
}

async function generateVideos() {
  // 校验：至少勾选 1 张提示词卡片，否则后端会生成 0 个任务
  const selectedCount = promptsData.filter(p => p.selected).length;
  if (!selectedCount) {
    toast("请至少勾选 1 张提示词卡片", "err");
    return;
  }

  // 保存编辑后的提示词（含勾选状态）
  try {
    await api(`/api/batch/${currentBatch}/prompts`, {
      method: "POST",
      body: JSON.stringify({ prompts: promptsData }),
    });
    toast(`已勾选 ${selectedCount} 个提示词，开始生成视频`, "ok");
  } catch(e) {
    toast("保存提示词失败", "err");
    return;
  }

  // 进入 Step 4：生成视频进度页
  currentStep = 4;
  renderSteps();
  renderStep4();

  try {
    await api(`/api/batch/${currentBatch}/run/step3`, { method: "POST" });
    await pollStep4();

    setTimeout(() => {
      currentStep = 5;
      renderSteps();
      renderStep5();
    }, 1000);
  } catch(e) {
    addLog("生成失败: " + e.message, "err");
  }
}

// ── Step 4: 生成视频 ─────────────────────────────────────────────

function renderStep4() {
  showPanel(`
    <div class="progress-container">
      <div class="progress-ring">
        <svg width="80" height="80">
          <circle class="track" cx="40" cy="40" r="34" />
          <circle class="bar" cx="40" cy="40" r="34"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6" id="progressBar" />
        </svg>
        <div class="progress-text" id="progressText">0%</div>
      </div>
      <div class="progress-label" id="progressLabel">正在生成视频...</div>
      <div class="progress-detail" id="progressDetail">调用 Kling API 生成 4-5s 无声视频</div>
      <div class="progress-log" id="progressLog"></div>
    </div>
  `);
}

async function pollStep4() {
  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const state = await api(`/api/batch/${currentBatch}/status`);
      const sp = state.step_progress?.step3;
      if (!sp) continue;

      const total = sp.total || 1;
      const done = sp.done || 0;
      const percent = (done / total) * 100;

      const results = sp.results || [];
      const lastResult = results[results.length - 1];
      let detail = `${done}/${total} 个片段`;
      if (lastResult) {
        const label = lastResult.variant_label || lastResult.variant_id || `方案${lastResult.roll || ""}`;
        detail += ` · ${lastResult.dish} ${label} ${lastResult.status === "ok" ? "✓" : "✕"}`;
      }

      updateProgress(percent, "正在调用 Kling API 生成视频...", detail);

      if (results.length > 0) {
        const newLogs = results.filter(r => !r._logged);
        newLogs.forEach(r => {
          const label = r.variant_label || r.variant_id || `方案${r.roll || ""}`;
          addLog(`${r.dish} ${label}: ${r.status === "ok" ? "成功" : "失败"}`,
                 r.status === "ok" ? "ok" : "err");
          r._logged = true;
        });
      }

      if (sp.status === "done") {
        updateProgress(100, "视频生成完成", `${done}/${total} 成功`);
        return;
      }
      if (sp.status === "error") throw new Error(sp.error);
    } catch(e) {
      if (e.message.includes("状态查询")) {
        // 忽略状态查询错误
      } else {
        addLog("生成失败: " + e.message, "err");
        throw e;
      }
    }
  }
}

function updateProgress(percent, label, detail) {
  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");
  const lbl = document.getElementById("progressLabel");
  const det = document.getElementById("progressDetail");

  const offset = 213.6 * (1 - percent / 100);
  if (bar) bar.style.strokeDashoffset = offset;
  if (text) text.textContent = Math.round(percent) + "%";
  if (lbl) lbl.textContent = label;
  if (det) det.textContent = detail || "";
}

function addLog(msg, type = "") {
  const log = document.getElementById("progressLog");
  if (!log) return;
  const line = document.createElement("div");
  line.className = "log-line " + type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

async function pollStep(stepName) {
  const stepProgress = { step1: 15, step2: 50 };
  const targetPercent = stepProgress[stepName] || 0;
  const labels = {
    step1: "正在预处理图片...",
    step2: "正在生成提示词...",
  };
  updateProgress3(targetPercent, labels[stepName] || "", "");

  while (true) {
    await new Promise(r => setTimeout(r, 2000));
    const state = await api(`/api/batch/${currentBatch}/status`);
    const sp = state.step_progress?.[stepName];
    if (!sp) continue;

    const total = sp.total || 1;
    const done = sp.done || 0;
    const percent = sp.status === "done"
      ? 100
      : Math.max(targetPercent, Math.min(99, Math.round((done / total) * 100)));
    const detail = stepName === "step1"
      ? `${done}/${total} 张图片`
      : `${done}/${total} 条提示词`;
    updateProgress3(percent, labels[stepName] || "", detail);

    if (sp.status === "done") return;
    if (sp.status === "error") throw new Error(sp.error);
  }
}

// ── Step 5: 审核挑选 ─────────────────────────────────────────────

let selectedClips = {};
let clipsData = {};
let step6Mode = "edit";

async function renderStep5() {
  clipsData = {};

  showPanel(`
    <div class="panel-title">审核挑选</div>
    <div class="panel-desc">查看每道菜的视频片段，选择最佳版本（点击卡片选用）</div>
    <div id="clipsContainer">
      <div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div>
    </div>
    <div class="action-bar">
      <div></div>
      <button class="btn btn-primary" id="confirmSelect" onclick="confirmSelection()" disabled>确认选用 →</button>
    </div>
  `);

  try {
    clipsData = await api(`/api/batch/${currentBatch}/clips`);
    renderClips();
  } catch(e) {
    document.getElementById("clipsContainer").innerHTML =
      '<div class="empty"><div class="empty-text">加载失败</div></div>';
  }
}

function renderClips() {
  const container = document.getElementById("clipsContainer");
  const dishNames = Object.keys(clipsData);

  if (!dishNames.length) {
    container.innerHTML = '<div class="empty"><div class="empty-text">暂无视频片段</div></div>';
    return;
  }

  container.innerHTML = dishNames.map(dish => {
    const clips = clipsData[dish];
    return `
      <div class="review-group">
        <div class="review-dish-name">${dish}</div>
        <div class="clips-grid">
          ${clips.map(c => `
            <div class="clip-card" data-dish="${dish}" data-file="${c.filename}"
                 onclick="toggleClip('${dish}', '${c.filename}', this)">
              <video src="/api/batch/${currentBatch}/clips/${c.filename}"
                     preload="metadata" controls></video>
              <div class="clip-info">
                <span>${c.variant_label || c.variant_id || `方案 ${c.roll}`}</span>
                <span>9:16 · 5s</span>
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");

  syncSelectedClipState();
}

function toggleClip(dish, filename, card) {
  // 每道菜只能选一个
  if (selectedClips[dish] === filename) {
    delete selectedClips[dish];
    card.classList.remove("selected");
  } else {
    // 取消同组其他选中
    document.querySelectorAll(`.clip-card[data-dish="${dish}"]`).forEach(c => {
      c.classList.remove("selected");
    });
    selectedClips[dish] = filename;
    card.classList.add("selected");
  }

  const hasSelection = Object.keys(selectedClips).length > 0;
  document.getElementById("confirmSelect").disabled = !hasSelection;
}

function syncSelectedClipState() {
  document.querySelectorAll(".clip-card").forEach(card => {
    const dish = card.dataset.dish;
    const file = card.dataset.file;
    card.classList.toggle("selected", selectedClips[dish] === file);
  });

  const confirmBtn = document.getElementById("confirmSelect");
  if (confirmBtn) {
    confirmBtn.disabled = !Object.keys(selectedClips).length;
  }
}

async function confirmSelection() {
  if (!Object.keys(selectedClips).length) { toast("请至少选择一个片段", "err"); return; }

  try {
    await api(`/api/batch/${currentBatch}/select`, {
      method: "POST",
      body: JSON.stringify({ selected: selectedClips }),
    });
    toast("已确认选用", "ok");
    currentStep = 6;
    step6Mode = "edit";
    renderSteps();
    renderStep6();
  } catch(e) {
    toast("提交失败", "err");
  }
}

// ── Step 6: 文案编辑 + 合成 ─────────────────────────────────────

let captionsData = {};

async function renderStep6() {
  step6Mode = "edit";
  showPanel(`
    <div class="panel-title">批量文案与合成</div>
    <div class="panel-desc">从已审核菜品池随机组合成片；每条 5-6 个菜品，甜品如出现只放最后</div>
    <div class="field-group">
      <label class="field-label">本批次生成条数</label>
      <input class="input" id="batchVideoCount" type="number" min="1" max="50" value="10" />
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field-group">
        <label class="field-label">每条最少菜品数</label>
        <input class="input" id="minDishesPerVideo" type="number" min="1" max="20" value="5" />
      </div>
      <div class="field-group">
        <label class="field-label">每条最多菜品数</label>
        <input class="input" id="maxDishesPerVideo" type="number" min="1" max="20" value="6" />
      </div>
    </div>
    <div id="captionsContainer">
      <div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div>
    </div>
    <div class="action-bar">
      <button class="btn btn-ghost" onclick="goStep(5); renderStep5();">← 上一步</button>
      <button class="btn btn-primary" onclick="submitCaptions()">批量合成 →</button>
    </div>
  `);

  try {
    captionsData = await api(`/api/batch/${currentBatch}/captions`);
    renderCaptions();
  } catch(e) {
    document.getElementById("captionsContainer").innerHTML =
      '<div class="empty"><div class="empty-text">加载失败</div></div>';
  }
}

function renderCaptions() {
  const container = document.getElementById("captionsContainer");
  const dishes = Object.keys(captionsData);

  container.innerHTML = dishes.map(dish => {
    const c = captionsData[dish];
    return `
      <div class="caption-card">
        <div class="caption-dish">${dish}</div>
        <div class="caption-field">
          <label class="field-label">字幕（显示在视频上）</label>
          <input class="input" value="${c.subtitle || ''}"
                 onchange="captionsData['${dish}'].subtitle = this.value" />
        </div>
        <div class="caption-field">
          <label class="field-label">发布文案（配音 + 平台文案）</label>
          <textarea class="textarea" onchange="captionsData['${dish}'].caption = this.value">${c.caption || ''}</textarea>
        </div>
      </div>
    `;
  }).join("");
}

async function submitCaptions() {
  try {
    if (!Object.keys(selectedClips).length) {
      toast("请先选择要合成的片段", "err");
      return;
    }

    const dishOrder = Object.keys(selectedClips);
    const countInput = document.getElementById("batchVideoCount");
    const rawCount = parseInt(countInput?.value || "10", 10);
    const count = Math.max(1, Math.min(Number.isFinite(rawCount) ? rawCount : 10, 50));
    const rawMinDishes = parseInt(document.getElementById("minDishesPerVideo")?.value || "5", 10);
    const rawMaxDishes = parseInt(document.getElementById("maxDishesPerVideo")?.value || "6", 10);
    const minDishes = Math.max(1, Math.min(Number.isFinite(rawMinDishes) ? rawMinDishes : 5, 20));
    const maxDishes = Math.max(minDishes, Math.min(Number.isFinite(rawMaxDishes) ? rawMaxDishes : 6, 20));
    if (dishOrder.length < minDishes) {
      toast(`当前已选择 ${dishOrder.length} 道菜，至少需要选择 ${minDishes} 道菜才能合成`, "err");
      return;
    }

    await api(`/api/batch/${currentBatch}/captions`, {
      method: "POST",
      body: JSON.stringify({ captions: captionsData }),
    });

    await api(`/api/batch/${currentBatch}/run/compose`, {
      method: "POST",
      body: JSON.stringify({
        video_config: {
          dish_order: dishOrder,
          count,
          min_dishes: minDishes,
          max_dishes: maxDishes,
          brand: { name: "示例品牌", cta: "评论区领优惠券" },
        },
      }),
    });

    currentStep = 6;
    step6Mode = "compose";
    renderSteps();
    renderComposeProgress();
  } catch(e) {
    toast("合成失败: " + e.message, "err");
  }
}

// ── Step 6: 合成下载 ─────────────────────────────────────────────

async function renderComposeProgress() {
  step6Mode = "compose";
  showPanel(`
    <div class="progress-container">
      <div class="progress-ring">
        <svg width="80" height="80">
          <circle class="track" cx="40" cy="40" r="34" />
          <circle class="bar" cx="40" cy="40" r="34"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6" id="composeBar" />
        </svg>
        <div class="progress-text" id="composeText">0%</div>
      </div>
      <div class="progress-label" id="composeLabel">正在批量合成视频...</div>
      <div class="progress-detail" id="composeDetail">拼接片段 · 添加字幕 · 配音配乐</div>
    </div>
  `);

  // 轮询合成进度
  while (true) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const state = await api(`/api/batch/${currentBatch}/status`);
      const sp = state.step_progress?.compose || {};

      if (state.status === "done") {
        const bar = document.getElementById("composeBar");
        const text = document.getElementById("composeText");
        if (bar) bar.style.strokeDashoffset = "0";
        if (text) text.textContent = "100%";
        showFinalVideo(state);
        return;
      }
      if (state.status === "error") {
        document.getElementById("composeLabel").textContent = "合成失败";
        document.getElementById("composeDetail").textContent = state.error || "";
        toast("合成失败: " + (state.error || ""), "err");
        return;
      }

      // 更新进度
      const bar = document.getElementById("composeBar");
      const text = document.getElementById("composeText");
      const total = sp.total || 1;
      const done = sp.done || 0;
      const percent = Math.round((done / total) * 100);
      if (bar) bar.style.strokeDashoffset = 213.6 * (1 - percent / 100);
      if (text) text.textContent = percent + "%";
      const detail = document.getElementById("composeDetail");
      if (detail) detail.textContent = `${done}/${total} 条成片`;

    } catch(e) {
      toast("状态查询失败", "err");
      return;
    }
  }
}

function showFinalVideo(state) {
  const videos = state.videos || [];
  const okVideos = videos.filter(v => v.status === "ok");
  const cards = okVideos.map(v => `
    <div class="final-card">
      <video src="/api/batch/${currentBatch}/final/${encodeURIComponent(v.filename)}" controls></video>
      <div class="final-card-title">
        <span>${v.id || v.filename}</span>
        <a href="/api/batch/${currentBatch}/final/${encodeURIComponent(v.filename)}" download>下载</a>
      </div>
      <div class="final-card-meta">
        ${v.dishes ? v.dishes.join(" / ") : ""}<br/>
        ${v.caption || ""}
      </div>
    </div>
  `).join("");

  showPanel(`
    <div class="final-container">
      <div class="panel-title">批量视频已完成</div>
      <div class="panel-desc">已生成 ${okVideos.length}/${videos.length || okVideos.length} 条成片，可逐条预览或打包下载</div>

      <div class="final-grid">
        ${cards || '<div class="empty"><div class="empty-text">暂无可预览成片</div></div>'}
      </div>

      <div style="margin-top: 24px;">
        <a class="btn btn-primary" href="/api/batch/${currentBatch}/final" download>
          下载全部
        </a>
        <button class="btn btn-ghost" onclick="newBatch()" style="margin-left: 12px;">
          新建批次
        </button>
      </div>
    </div>
  `);
}

function newBatch() {
  currentBatch = null;
  currentStep = 1;
  dishes = [];
  selectedClips = {};
  promptsData = [];
  captionsData = {};
  step6Mode = "edit";
  renderSteps();
  renderStep1();
}

// ── 路由 ──────────────────────────────────────────────────────────

function renderPanel() {
  switch(currentStep) {
    case 1: renderStep1(); break;
    case 2: renderStep2(); break;
    case 3: renderStep3(); break;
    case 4: renderStep4(); break;
    case 5: renderStep5(); break;
    case 6: step6Mode === "compose" ? renderComposeProgress() : renderStep6(); break;
  }
}

// ── 初始化 ────────────────────────────────────────────────────────

async function init() {
  await checkConfig();
  currentStep = 1;
  renderSteps();
  renderStep1();
}

init();
</script>
</body>
</html>
